# @soleil-clems: Snap package configuration
name: soca-manager
base: core24
version: git
summary: Database administration made simple
description: |
  A modern, self-hosted, multi-database administration tool.
  Manage MySQL, PostgreSQL, and MongoDB from a single desktop app.
  Start/stop the socAdmin server, install database engines, and open
  the web interface — all without touching the terminal.

grade: stable
confinement: strict

icon: manager/build/appicon.png

architectures:
  - build-on: [amd64]
  - build-on: [arm64]

parts:
  socadmin-server:
    plugin: go
    source: .
    build-snaps:
      - go/1.24/stable
      - node/22/stable
    build-packages:
      - gcc
    override-build: |
      cd frontend && npm ci && npm run build && cd ..
      CGO_ENABLED=1 go build -ldflags="-s -w" -o $SNAPCRAFT_PART_INSTALL/bin/socadmin .

  soca-manager:
    plugin: go
    source: manager/
    after: [socadmin-server]
    build-snaps:
      - go/1.24/stable
      - node/22/stable
    build-packages:
      - gcc
      - libgtk-3-dev
      - libwebkit2gtk-4.1-dev
    stage-packages:
      - libgtk-3-0t64
      - libwebkit2gtk-4.1-0
    override-build: |
      go install github.com/wailsapp/wails/v2/cmd/wails@latest
      cd $SNAPCRAFT_PART_SRC
      cd frontend && npm ci && cd ..
      wails build -clean -tags webkit2_41
      cp build/bin/soca-manager $SNAPCRAFT_PART_INSTALL/bin/soca-manager

apps:
  soca-manager:
    command: bin/soca-manager
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - home
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - unity7
